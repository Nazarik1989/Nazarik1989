<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title description">
  <title id="title">Naz AI Lab ecosystem</title>
  <desc id="description">Readable map of Relay Agent, NAZ AI, VOID Entity, publishing infrastructure and four product experiments.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#12304a" stroke-width="1" opacity="0.28" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41dfff" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a88cff" />
    </marker>
    <style>
      .label { font: 700 27px "Segoe UI", Arial, sans-serif; fill: #f4faff; }
      .sub { font: 18px "Segoe UI", Arial, sans-serif; fill: #afc7da; }
      .section { font: 700 18px "Segoe UI", Arial, sans-serif; letter-spacing: 3px; fill: #66e8ff; }
      .edge { fill: none; stroke: #41dfff; stroke-width: 4; marker-end: url(#arrow-cyan); }
      .mutual { fill: none; stroke: #a88cff; stroke-width: 4; marker-start: url(#arrow-violet); marker-end: url(#arrow-violet); }
      .node { fill: #091522; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="980" rx="28" fill="#050b13" />
  <rect width="1200" height="980" rx="28" fill="url(#grid)" />

  <rect x="350" y="42" width="500" height="112" rx="56" fill="#071a2d" stroke="#00e5ff" stroke-width="4" filter="url(#glow)" />
  <text x="600" y="91" text-anchor="middle" class="label" font-size="34">NAZ AI LAB</text>
  <text x="600" y="126" text-anchor="middle" class="sub">Nazar · AI Systems Builder</text>

  <text x="60" y="212" class="section">CORE AGENTS</text>

  <path class="edge" d="M 380 300 H 430" />
  <path class="mutual" d="M 770 300 H 820" />

  <rect class="node" x="60" y="240" width="320" height="120" rx="24" stroke="#b7e8ff" />
  <text x="220" y="292" text-anchor="middle" class="label">RELAY AGENT</text>
  <text x="220" y="326" text-anchor="middle" class="sub">work → safe evidence</text>

  <rect class="node" x="430" y="240" width="340" height="120" rx="24" stroke="#00e5ff" filter="url(#glow)" />
  <text x="600" y="292" text-anchor="middle" class="label">NAZ AI</text>
  <text x="600" y="326" text-anchor="middle" class="sub">editorial · orchestration</text>

  <rect class="node" x="820" y="240" width="320" height="120" rx="24" stroke="#d4d9e2" />
  <text x="980" y="292" text-anchor="middle" class="label">VOID ENTITY</text>
  <text x="980" y="326" text-anchor="middle" class="sub">observer · reflection</text>

  <path class="edge" d="M 600 360 V 420" />
  <path class="edge" d="M 980 360 V 390 Q 980 420 950 420 H 770" />

  <rect class="node" x="430" y="420" width="340" height="120" rx="24" stroke="#52b8ff" />
  <text x="600" y="472" text-anchor="middle" class="label">ISOLATED PUBLISHER</text>
  <text x="600" y="506" text-anchor="middle" class="sub">shared queue · safe credentials</text>

  <path class="edge" d="M 770 480 H 820" />
  <rect class="node" x="820" y="420" width="320" height="120" rx="24" stroke="#7c8fa6" />
  <text x="980" y="472" text-anchor="middle" class="label">PUBLIC CHANNELS</text>
  <text x="980" y="506" text-anchor="middle" class="sub">Telegram · VK</text>

  <text x="60" y="620" class="section">PRODUCTS / EXPERIMENTS</text>

  <rect class="node" x="80" y="650" width="480" height="120" rx="24" stroke="#2fd6be" />
  <text x="320" y="702" text-anchor="middle" class="label">FUTURE SELF AI</text>
  <text x="320" y="736" text-anchor="middle" class="sub">goals · tasks · knowledge</text>

  <rect class="node" x="640" y="650" width="480" height="120" rx="24" stroke="#52b8ff" />
  <text x="880" y="702" text-anchor="middle" class="label">PROPSCAN AI</text>
  <text x="880" y="736" text-anchor="middle" class="sub">documents · risks · reports</text>

  <rect class="node" x="80" y="810" width="480" height="120" rx="24" stroke="#419dff" />
  <text x="320" y="862" text-anchor="middle" class="label">PACKAGING AI</text>
  <text x="320" y="896" text-anchor="middle" class="sub">request → structured brief</text>

  <rect class="node" x="640" y="810" width="480" height="120" rx="24" stroke="#be69ff" />
  <text x="880" y="862" text-anchor="middle" class="label">ZAYKA AI</text>
  <text x="880" y="896" text-anchor="middle" class="sub">community companion</text>
</svg>
